version: '3.8'

services:
  # Backend Service - Flask API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mirofish-backend
    restart: unless-stopped
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
      - PYTHONUNBUFFERED=1
      # LLM API Configuration - Load from .env file
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-qwen-plus}
      # Zep Cloud Configuration
      - ZEP_API_KEY=${ZEP_API_KEY}
      # Optional Boost LLM Configuration
      - LLM_BOOST_API_KEY=${LLM_BOOST_API_KEY:-}
      - LLM_BOOST_BASE_URL=${LLM_BOOST_BASE_URL:-}
      - LLM_BOOST_MODEL_NAME=${LLM_BOOST_MODEL_NAME:-}
    volumes:
      # Persistent storage for uploads and simulations
      - uploads:/app/uploads
      - logs:/app/logs
      # Mount .env file if needed (alternative to environment variables above)
      # - ./.env:/app/.env:ro
    ports:
      # Expose backend port (optional, mainly accessed via frontend proxy)
      - "5001:5001"
    networks:
      - mirofish-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service - Vue + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mirofish-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mirofish-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# Named volumes for data persistence
volumes:
  uploads:
    driver: local
    name: mirofish-uploads
  logs:
    driver: local
    name: mirofish-logs

# Custom network
networks:
  mirofish-network:
    driver: bridge
    name: mirofish-network
